[package]
name = "rustboard"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A dark, infinite-canvas sticky-note board built with egui"
license = "MIT"

[dependencies]
eframe = { version = "0.37.0", features = ["persistence"] }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
ron = "0.12"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
