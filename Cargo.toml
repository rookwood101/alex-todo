[package]
name = "rustboard"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A dark, infinite-canvas sticky-note board built with egui"
license = "MIT"

[dependencies]
eframe = { version = "0.37.0", features = ["persistence"] }
jiff = "1.0"
ron = "0.12"
rusqlite = { version = "0.43", features = ["bundled-full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
uuid = { version = "1.0", features = ["v4"] }

[profile.dev.package."*"]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
